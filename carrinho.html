<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seu Carrinho - Halo Coffee</title>
  <link rel="stylesheet" href="css/carrinho.css">
</head>
<body>

  <div class="pagina-carrinho-container">
    <aside class="carrinho-sidebar">
      
      <div class="carrinho-titulo-box">
        <h2 class="carrinho-titulo">Seu carrinho</h2>
        <span class="icone-carrinho">&#128722;</span>
      </div>

      <div class="carrinho-itens">
        <div class="carrinho-item">
          <div class="item-info">
            <span class="item-nome">-Moedor de café</span>
            <span class="item-preco">R$ 59,90</span>
          </div>
          <div class="item-acoes">
            <button class="btn-remover">REMOVER</button>
            <div class="item-quantidade">Quantidade: 1</div>
          </div>
        </div>

        <div class="carrinho-item">
          <div class="item-info">
            <span class="item-nome">-Prensador Frances</span>
            <span class="item-preco">R$ 49,90</span>
          </div>
          <div class="item-acoes">
            <button class="btn-remover">REMOVER</button>
            <div class="item-quantidade">Quantidade: 1</div>
          </div>
        </div>
      </div>

      <div class="container-adicionar-mais">
        <a href="loja.html" class="btn-adicionar-mais">ADICIONAR + PRODUTOS</a>
      </div>

      <div class="carrinho-rodape">
        <div class="carrinho-total">TOTAL: 109,8</div>
        <button class="btn-finalizar">FINALIZAR COMPRA</button>
        
        <a href="loja.html" class="btn-voltar">VOLTAR</a>
      </div>

    </aside>
  </div>

</body>
</html>
